services:
  rag-postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      # Dev default only; override via the shell/.env — production uses RDS +
      # Secrets Manager instead of this container (see docs/deployment.md).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: rag
    ports:
      - "5433:5432"
    volumes:
      - rag_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local LLM server for LLM_PROVIDER=ollama. Pull the model once with:
  #   docker-compose exec ollama ollama pull qwen2.5:1.5b
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  rag-app:
    build: .
    # RAG_DATABASE_URL below intentionally overrides whatever's in .env: from
    # inside this compose network the database is reachable at the service
    # name "rag-postgres" on its container port 5432, not "localhost:5433"
    # (that host-side mapping only exists for tools running outside compose,
    # like scripts/init_db.py or a local `alembic` invocation).
    env_file:
      - .env
    environment:
      RAG_DATABASE_URL: postgresql+psycopg://rag:${POSTGRES_PASSWORD:-rag}@rag-postgres:5432/rag
      # Same reasoning: inside compose, Ollama is the "ollama" service, not localhost.
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      rag-postgres:
        condition: service_healthy

volumes:
  rag_postgres_data:
  ollama_models:
